apiVersion: eks.services.k8s.aws/v1alpha1
kind: Cluster
metadata:
  name: $CLUSTER_NAME
spec:
  name: $CLUSTER_NAME
  roleARN: $CLUSTER_ROLE
  accessConfig:
    authenticationMode: $AUTHENTICATION_MODE
  version: "$K8S_VERSION"
  resourcesVPCConfig:
    endpointPrivateAccess: true
    endpointPublicAccess: true
    subnetIDs:
      - "$PUBLIC_SUBNET_1"
      - "$PUBLIC_SUBNET_2"
  controlPlaneScalingConfig:
    tier: "tier-xl"
  # Intentionally PARTIAL: only kubeAPIServerConfig.eventTTL is set. The sibling
  # serviceNodePortRange, and the entire kubeSchedulerConfig /
  # kubeControllerManagerConfig, are omitted so the test can assert that
  # per-field late_initialize adopts the backend defaults for them instead of
  # drifting.
  kubeAPIServerConfig:
    eventTTL: "$EVENT_TTL"
